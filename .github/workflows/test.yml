name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      # Pure-Nim stack now (harfnim shaping/subsetting, image codecs,
      # archive deflate): no system libraries, no pkg-config queries.
      # Only Windows needs setup: install the UCRT64 GCC so Nim does
      # not fall back to the stray C:/mingw64 gcc on PATH, whose ld
      # cannot use the ucrt64 import libraries.
      pre-install-command: |
        set -eu
        case "$RUNNER_OS" in
          Windows)
            C:/msys64/usr/bin/pacman -Sy --noconfirm
            C:/msys64/usr/bin/pacman -S --noconfirm --needed \
              mingw-w64-ucrt-x86_64-gcc
            echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
            # Fail fast with an absolute path (PATH order is not ours
            # to assume): the compiler must be ucrt64's.
            C:/msys64/ucrt64/bin/gcc --version
            ;;
        esac
